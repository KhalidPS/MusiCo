# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Points Gradle at Android Studio's bundled JBR (JDK 25) so CLI builds don't fall back to
# whatever ancient JDK happens to be on PATH. IDE-run builds override this per the note above.
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
# AGP 9's new DSL. The old one is what makes the `android { }` accessor resolve to the
# deprecated BaseAppModuleExtension, and it is removed altogether in AGP 10.0.
#
# This was previously forced to `false` because androidx.baselineprofile 1.4.1 could not detect
# app modules under the new DSL/variant API - it fails at plugin-apply time with "Failed to apply
# plugin class BaselineProfileAppTargetPlugin". 1.5.0-beta01 fixes that, so the opt-out is gone.
android.newDsl=true

# R8 full mode is off because it breaks the Glance app widget in release builds.
#
# Symptom: the widget renders fine in debug but the launcher shows "Can't load widget"
# forever in release. Glance never delivers any RemoteViews at all - the app process starts
# for the APPWIDGET_UPDATE broadcast, throws nothing, and simply never pushes a view, so the
# host is left showing its own error view.
#
# Bisected on an emulator by placing the widget on the home screen from identical builds:
#   debug                                          -> renders
#   release (minify + shrinkResources, full mode)  -> "Can't load widget"
#   release (minify + shrinkResources, this flag)  -> renders
# So it is full mode specifically, not minification or resource shrinking.
#
# A scoped `-keep class androidx.glance.** { *; }` was tried first and does NOT fix it, so
# the optimization that breaks is outside Glance's own classes (the diff of R8's usage.txt
# between the two modes shows full-mode-only enum unboxing on LayoutSize and
# ActionTrampolineType, plus whole translator classes removed). Narrowing it further would
# mean keeping most of the Compose runtime/DataStore anyway, which is what this flag does
# more honestly. Revisit when androidx.glance is next updated.
#
# NOTE: this option is deprecated - AGP warns about it on every build and it will be removed
# (AGP 10 is the likely point, same upgrade this file already tracks for android.newDsl).
# So this is a stopgap, not a resting place. Cost measured on this app: APK 10,998,669 ->
# 11,724,416 bytes (+709 KB, +6.6%), uncompressed dex +1.95 MB (+22.6%), 2 -> 3 dex files.
android.enableR8.fullMode=false
